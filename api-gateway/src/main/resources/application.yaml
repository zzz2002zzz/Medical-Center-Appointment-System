server:
  port: 8080

spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: patient-service
            uri: http://localhost:8081
            predicates:
              - Path=/patients/**
          - id: doctor-service
            uri: http://localhost:8082
            predicates:
              - Path=/doctors/**
          - id: appointment-service
            uri: http://localhost:8083
            predicates:
              - Path=/appointments/**

jwt:
  secret: mySuperSecretKeyForMedicalCenterAppointmentSystem2026
  expirationMs: 3600000

api:
  key: demo-key-123
